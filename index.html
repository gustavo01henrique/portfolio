<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio | Gustavo Henrique</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navegacao">
        <ul class="menu">
            <li>
                <a href="#inicio">Início</a>
            </li>
            <li>
                <a href="#sobre">Sobre</a>
            </li>
            <li> 
                <a href="#projetos">Projetos</a>
            </li>
            <li>
                <a href="#contato">Contato</a>
            </li>
        </ul>
    </nav>
    <main id="inicio" class="cabecalho">
       <img src="" alt="" class="foto-perfil">
             <h1>Gustavo Henrique</h1>
            <p>Desenvolvedor Web</p>
         <section id="sobre" class="sobre">
        <h2 class="sobre-titulo">Sobre</h2>
        <div class="sobre-conteudo">
            <p class="sobre-paragrafo">Sou um desenvolvedor web apaixonado por criar experiências digitais envolventes.</p>
        </div> 
       </section>

       <section id="projetos" class="projetos">
         <h2 class="projetos-titulo">Projetos Realizados</h2>
            <div class="projetos-conteudo">
                 <div class="projetos-item">
                      <img src="" alt="" class="projetos-imagem">
                          <h3 class="projetos-nome">Nome do Projeto</h3>
                         <p class="projetos-descricao">Descrição do projeto.</p>
                 </div>
         </div>
       </section>

       <section id="contato" class="contato">
            <h2 class="contato-titulo">Contato</h2>
            <form class="contato-conteudo">
                <div>
                    <input type="text" placeholder="Nome">
                </div>

                <div>
                    <input type="email" placeholder="Email">
                </div>

                <div>  
                    <textarea placeholder="Digite sua mensagem aqui..."></textarea>
                </div>

                <div>
                    <button type="submit">Enviar</button>
                </div>

            </form>
        </section>
    </main>
</body>
</html>
